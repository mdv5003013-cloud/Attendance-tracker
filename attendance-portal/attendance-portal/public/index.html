<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--ink:#16241f;--mut:#5d6b65;--line:#d5dcd7;--card:#fff;--pres:#1f7a5a;--leave:#d99a1c;--bad:#b3392f}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
header{display:flex;gap:16px;align-items:center;padding:14px 24px;background:var(--ink);color:#fff;flex-wrap:wrap}
header b{font-size:18px;margin-right:auto}header span{color:#b9c7c0}
nav{display:flex;gap:4px;padding:0 24px;background:var(--ink)}
nav button{background:none;border:0;color:#b9c7c0;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:var(--leave)}
main{max-width:980px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px}
h2{margin:0 0 12px;font-size:20px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
.btn.go{background:var(--pres)}.btn.no{background:var(--bad)}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--leave);outline-offset:1px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.err{color:var(--bad);min-height:1.4em;margin-top:8px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--mut);font-weight:500}
.tag{padding:2px 9px;border-radius:99px;font-size:13px;background:#e6ebe8}
.tag.approved{background:#d3ece2;color:#14583f}.tag.rejected{background:#f5d9d6;color:#8a2a22}.tag.pending{background:#f8ebc9;color:#7a5608}
.clock{font-size:34px;font-weight:700;letter-spacing:-.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal div{aspect-ratio:1.3;border-radius:4px;background:#eef1ee;padding:4px 6px;font-size:13px;color:var(--mut)}
.cal .h{background:none;aspect-ratio:auto;padding:0;text-align:center}
.cal .p{background:var(--pres);color:#fff}.cal .l{background:var(--leave);color:#2b1d00}
.leg{display:flex;gap:16px;font-size:14px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
.bar{height:8px;background:#e3e8e4;border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--pres)}
#auth{max-width:380px;margin:60px auto}.hide{display:none}
.tw{overflow-x:auto}
</style></head><body>
<div id="auth" class="card hide">
  <h2 id="at">Sign in</h2>
  <div id="nm" class="hide"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="aerr" role="alert"></div>
  <button class="btn" id="abtn" style="width:100%">Sign in</button>
  <p style="text-align:center"><a href="#" id="swap">Create an account</a></p>
  <p style="font-size:13px;color:var(--mut)">The first account created becomes the admin.</p>
</div>

<div id="app" class="hide">
  <header><b>Attendance Portal</b><span id="who"></span><button class="btn ghost" style="color:#fff;border-color:#4b5f57" id="out">Sign out</button></header>
  <nav id="nav"></nav>
  <main>
    <section id="v-today">
      <div class="card"><h2>Today</h2>
        <div class="clock" id="clock"></div><p id="tstat" style="color:var(--mut)"></p>
        <div class="row" style="max-width:360px"><button class="btn go" id="cin">Check in</button><button class="btn no" id="cout">Check out</button></div>
        <div class="err" id="terr" role="alert"></div></div>
      <div class="card"><div class="row" style="align-items:end"><h2 style="flex:3;margin:0">My month</h2><input type="month" id="mm" style="flex:1"></div>
        <div class="cal" id="cal"></div>
        <div class="leg"><span><i style="background:var(--pres)"></i>Present</span><span><i style="background:var(--leave)"></i>Approved leave</span></div></div>
    </section>

    <section id="v-leave" class="hide">
      <div class="card"><h2>Request leave</h2>
        <div class="row"><div><label for="ls">From</label><input type="date" id="ls"></div><div><label for="le">To</label><input type="date" id="le"></div>
        <div><label for="lt">Type</label><select id="lt"><option>Casual</option><option>Sick</option><option>Earned</option><option>Unpaid</option></select></div></div>
        <label for="lr">Reason</label><textarea id="lr" rows="2"></textarea>
        <div class="err" id="lerr" role="alert"></div><button class="btn" id="lsub">Send request</button></div>
      <div class="card"><h2 id="lh">My requests</h2><div class="tw"><table><thead id="lthead"></thead><tbody id="ltb"></tbody></table></div></div>
    </section>

    <section id="v-dash" class="hide">
      <div class="card"><div class="row" style="align-items:end"><h2 style="flex:3;margin:0">Monthly attendance</h2><input type="month" id="dm" style="flex:1"></div>
        <div class="tw"><table><thead><tr><th>Employee</th><th>Days present</th><th>Leave days</th><th>Avg hours/day</th><th></th></tr></thead><tbody id="dtb"></tbody></table></div></div>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
let tok=localStorage.tok,me=JSON.parse(localStorage.me||'null'),reg=false,tab='today';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=t=>t?new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}):'—';
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:opt.body&&JSON.stringify(opt.body)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&tok){signout();}
  if(!r.ok)throw new Error(d.error||'Something went wrong');return d;
}
function signout(){localStorage.clear();tok=me=null;show()}
function show(){
  $('auth').classList.toggle('hide',!!tok);$('app').classList.toggle('hide',!tok);
  if(!tok)return;
  $('who').textContent=me.name+' · '+me.role;
  const tabs=[['today','Today'],['leave','Leave']];if(me.role==='admin')tabs.push(['dash','Dashboard']);
  $('nav').innerHTML=tabs.map(([k,l])=>`<button data-k="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  ['today','leave','dash'].forEach(k=>$('v-'+k).classList.toggle('hide',k!==tab));
  ({today:loadToday,leave:loadLeaves,dash:loadDash})[tab]();
}
$('nav').onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;show()}};
$('out').onclick=signout;
$('swap').onclick=e=>{e.preventDefault();reg=!reg;$('nm').classList.toggle('hide',!reg);$('at').textContent=reg?'Create account':'Sign in';$('abtn').textContent=reg?'Create account':'Sign in';$('swap').textContent=reg?'I already have an account':'Create an account'};
$('abtn').onclick=async()=>{
  try{const d=await api(reg?'register':'login',{method:'POST',body:{name:$('name').value,email:$('email').value,password:$('pw').value}});
    tok=d.token;me=d.user;localStorage.tok=tok;localStorage.me=JSON.stringify(me);$('aerr').textContent='';show()}
  catch(e){$('aerr').textContent=e.message}
};
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})},1000);

async function loadToday(){
  const t=await api('attendance/today');
  $('cin').disabled=!!t;$('cout').disabled=!t||!!t.check_out;
  $('tstat').textContent=!t?"You haven't checked in yet.":`Checked in ${tm(t.check_in)}`+(t.check_out?` · checked out ${tm(t.check_out)}`:'');
  if(!$('mm').value)$('mm').value=ym(new Date());
  const m=$('mm').value,[Y,M]=m.split('-').map(Number);
  const rows=await api('attendance?month='+m),lv=(await api('leaves')).filter(l=>l.status==='approved'&&(me.role!=='admin'||l.name===me.name));
  const pres=new Set(rows.map(r=>r.day)),days=new Date(Y,M,0).getDate(),off=(new Date(Y,M-1,1).getDay()+6)%7;
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(off);
  for(let d=1;d<=days;d++){const k=`${m}-${String(d).padStart(2,'0')}`;
    const onL=lv.some(l=>l.start_date<=k&&l.end_date>=k);
    h+=`<div class="${pres.has(k)?'p':onL?'l':''}">${d}</div>`}
  $('cal').innerHTML=h;
}
$('mm').onchange=loadToday;
$('cin').onclick=()=>act('attendance/checkin');$('cout').onclick=()=>act('attendance/checkout');
async function act(p){try{await api(p,{method:'POST'});$('terr').textContent='';loadToday()}catch(e){$('terr').textContent=e.message}}

async function loadLeaves(){
  const adm=me.role==='admin',L=await api('leaves');
  $('lh').textContent=adm?'All requests':'My requests';
  $('lthead').innerHTML=`<tr>${adm?'<th>Employee</th>':''}<th>Dates</th><th>Type</th><th>Reason</th><th>Status</th>${adm?'<th></th>':''}</tr>`;
  $('ltb').innerHTML=L.length?L.map(l=>`<tr>${adm?`<td>${esc(l.name)}</td>`:''}<td>${l.start_date} to ${l.end_date}</td><td>${esc(l.type)}</td><td>${esc(l.reason)}</td>
    <td><span class="tag ${l.status}">${l.status}</span></td>
    ${adm?`<td>${l.status==='pending'?`<button class="btn go" data-d="approved" data-i="${l.id}">Approve</button> <button class="btn no" data-d="rejected" data-i="${l.id}">Reject</button>`:''}</td>`:''}</tr>`).join('')
    :'<tr><td colspan="6">No leave requests yet.</td></tr>';
}
$('ltb').onclick=async e=>{if(!e.target.dataset.d)return;await api('leaves/'+e.target.dataset.i,{method:'PATCH',body:{status:e.target.dataset.d}});loadLeaves()};
$('lsub').onclick=async()=>{
  try{await api('leaves',{method:'POST',body:{start_date:$('ls').value,end_date:$('le').value,type:$('lt').value,reason:$('lr').value}});
    $('lerr').textContent='';$('lr').value='';loadLeaves()}catch(e){$('lerr').textContent=e.message}
};

async function loadDash(){
  if(!$('dm').value)$('dm').value=ym(new Date());
  const m=$('dm').value,[Y,M]=m.split('-').map(Number),D=await api('dashboard?month='+m),dim=new Date(Y,M,0).getDate();
  $('dtb').innerHTML=D.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.present} / ${dim}</td><td>${r.leave_days}</td><td>${r.avg_hours}</td>
    <td><div class="bar" title="${r.present} of ${dim} days"><i style="width:${Math.min(100,r.present/dim*100)}%"></i></div></td></tr>`).join('');
}
$('dm').onchange=loadDash;
show();
</script></body></html>
